<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptMaster AI | Professional Engineering</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>

<body class="flex flex-col min-h-screen">

<!-- NAV -->
<nav class="glass-nav sticky top-0 z-50 border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">P</div>
            <span class="text-xl font-bold text-gray-900 tracking-tight">PromptMaster</span>
        </a>

        <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-gray-600">
            <a href="/" class="hover:text-blue-600 transition">Optimizer</a>
            <a href="/blog" class="hover:text-blue-600 transition">Blog</a>
            <a href="/contact" class="hover:text-blue-600 transition">Support</a>
            <a href="#" class="bg-gray-900 text-white px-5 py-2 rounded-full hover:bg-gray-800 transition">Get Started</a>
        </div>
    </div>
</nav>

<main class="flex-grow">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="bg-white border-t border-gray-200 py-12 px-6 mt-20">
    <div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-12">
        <div>
            <p class="font-bold text-gray-900 mb-4">PromptMaster AI</p>
            <p class="text-gray-500 text-sm">The industry standard for prompt engineering.</p>
        </div>

        <div class="flex flex-col gap-3 text-sm text-gray-500">
            <p class="font-bold text-gray-900">Resources</p>
            <a href="/blog">Prompting Guide</a>
        </div>

        <div class="flex flex-col gap-3 text-sm text-gray-500">
            <p class="font-bold text-gray-900">Legal</p>
            <a href="#">Privacy Policy</a>
        </div>
    </div>
</footer>

</body>
</html>
