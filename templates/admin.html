{% extends "base.html" %}
{% block content %}

<div class="max-w-6xl mx-auto py-16 px-6">

    <!-- HEADER -->
    <div class="mb-10">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Admin Dashboard</h1>
        <p class="text-gray-500">User Contact Messages</p>
    </div>

    <!-- TABLE CARD -->
    <div class="bg-white rounded-3xl border border-gray-200 shadow-lg overflow-hidden">

        <div class="overflow-x-auto">

            <table class="w-full border-collapse">

                <!-- HEAD -->
                <thead class="bg-gray-100 text-gray-700 text-sm uppercase">
                    <tr>
                        <th class="p-4 text-left">ID</th>
                        <th class="p-4 text-left">Email</th>
                        <th class="p-4 text-left">Message</th>
                        <th class="p-4 text-left">Date</th>
                    </tr>
                </thead>

                <!-- BODY -->
                <tbody class="text-gray-700">

                    {% for c in contacts %}
                    <tr class="border-t hover:bg-gray-50 transition">

                        <!-- ID -->
                        <td class="p-4 font-medium">
                            {{ c[0] }}
                        </td>

                        <!-- EMAIL -->
                        <td class="p-4 text-blue-600 font-semibold">
                            {{ c[1] }}
                        </td>

                        <!-- MESSAGE -->
                        <td class="p-4 max-w-md">
                            <details class="cursor-pointer">
                                <summary class="text-blue-600">View Message</summary>
                                <p class="mt-2 text-gray-600 whitespace-pre-wrap">
                                    {{ c[2] }}
                                </p>
                            </details>
                        </td>

                        <!-- DATE -->
                        <td class="p-4 text-sm text-gray-500">
                            {{ c[3] }}
                        </td>

                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
