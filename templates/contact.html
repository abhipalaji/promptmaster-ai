{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto py-20 px-6">

    <!-- HEADER -->
    <div class="text-center mb-14">
        <h1 class="text-4xl font-bold text-gray-900 mb-4 tracking-tight">
            Need Assistance?
        </h1>
        <p class="text-gray-500 text-lg">
            Have questions, feedback, or business inquiries? We’re here to help.
        </p>
    </div>

    <!-- CARD -->
    <div class="bg-white p-10 rounded-3xl card-shadow border border-gray-100">

        <form onsubmit="submitForm(event)" class="space-y-6">

            <!-- EMAIL -->
            <div>
                <label class="text-sm font-bold text-gray-700">Email Address</label>
                <input id="email" type="email" placeholder="you@example.com"
                class="w-full mt-2 p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            </div>

            <!-- MESSAGE -->
            <div>
                <label class="text-sm font-bold text-gray-700">Message</label>
                <textarea id="message" placeholder="Tell us how we can help..."
                class="w-full mt-2 p-4 bg-gray-50 border border-gray-200 rounded-xl h-36 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-none"></textarea>
            </div>

            <!-- BUTTON -->
            <button id="submitBtn"
                class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition active:scale-95 flex items-center justify-center gap-2">

                <span id="btnText">Send Message</span>

                <!-- LOADER -->
                <svg id="btnLoader" class="hidden animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"></circle>
                    <path class="opacity-75" fill="white"
                        d="M4 12a8 8 0 018-8v8H4z">
                    </path>
                </svg>

            </button>

        </form>

        <!-- STATUS -->
        <div id="statusMsg"
            class="hidden mt-6 text-center text-sm font-semibold px-4 py-3 rounded-xl">
        </div>

    </div>

</div>

<script>
async function submitForm(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();
    const status = document.getElementById("statusMsg");

    const btnText = document.getElementById("btnText");
    const btnLoader = document.getElementById("btnLoader");

    // Reset UI
    status.classList.add("hidden");

    if (!email || !message) {
        status.innerText = "⚠️ Please fill all fields";
        status.className = "mt-6 text-center text-sm font-semibold text-yellow-700 bg-yellow-100 px-4 py-3 rounded-xl";
        status.classList.remove("hidden");
        return;
    }

    // Loading state
    btnText.innerText = "Sending...";
    btnLoader.classList.remove("hidden");

    try {
        const res = await fetch("/contact-submit", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, message })
        });

        const data = await res.json();

        if (data.success) {
            status.innerText = "✅ Message sent successfully!";
            status.className = "mt-6 text-center text-sm font-semibold text-green-700 bg-green-100 px-4 py-3 rounded-xl";

            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        } else {
            status.innerText = "❌ Failed to send message";
            status.className = "mt-6 text-center text-sm font-semibold text-red-700 bg-red-100 px-4 py-3 rounded-xl";
        }

    } catch {
        status.innerText = "❌ Network error. Try again.";
        status.className = "mt-6 text-center text-sm font-semibold text-red-700 bg-red-100 px-4 py-3 rounded-xl";
    }

    // Reset button
    btnText.innerText = "Send Message";
    btnLoader.classList.add("hidden");

    status.classList.remove("hidden");
}
</script>

{% endblock %}
